<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <title>Kalkulator PDAM Tirta Wijaya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --accent: #3b82f6
        }

        body {
            padding-bottom: calc(95px + env(safe-area-inset-bottom));
            -webkit-tap-highlight-color: transparent
        }

        .app {
            max-width: 680px
        }

        .section-title {
            font-size: .75rem;
            letter-spacing: .12em;
            font-weight: 700;
            color: var(--bs-secondary-color);
            text-transform: uppercase
        }

        .card {
            border-radius: 1.25rem
        }

        .total-box {
            background: var(--bs-tertiary-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 1rem
        }

        .total-amount {
            font-size: 2.1rem;
            font-weight: 800
        }

        .rincian-row {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: .7rem 0;
            border-bottom: 1px dashed var(--bs-border-color);
            font-size: .92rem
        }

        .rincian-row:last-of-type {
            border-bottom: 0
        }

        .navbar-blur {
            backdrop-filter: blur(10px);
            background: color-mix(in srgb, var(--bs-body-bg) 82%, transparent)
        }

        .bottom-nav {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(14px + env(safe-area-inset-bottom));
            display: flex;
            gap: .25rem;
            background: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 999px;
            padding: .3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
            z-index: 1050
        }

        .bottom-nav button {
            border: 0;
            background: transparent;
            border-radius: 999px;
            min-width: 100px;
            padding: .45rem .9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: .72rem;
            color: var(--bs-secondary-color)
        }

        .bottom-nav button i {
            font-size: 1.15rem
        }

        .bottom-nav button.active {
            color: var(--accent);
            background: var(--bs-tertiary-bg)
        }

        .table-tarif {
            font-size: .78rem
        }

        @keyframes pulse {
            0% {
                transform: scale(1)
            }

            40% {
                transform: scale(1.04)
            }

            100% {
                transform: scale(1)
            }
        }

        .pulse {
            animation: pulse .35s ease
        }

        /* Kredit "created with 💖 by T.K" */
        .credit {
            font-size: .8rem;
            color: var(--bs-secondary-color)
        }

        .credit .author {
            color: var(--accent);
            font-weight: 700
        }

        .heart {
            display: inline-block;
            animation: beat 1.2s ease-in-out infinite
        }

        @keyframes beat {

            0%,
            100% {
                transform: scale(1)
            }

            25% {
                transform: scale(1.25)
            }

            50% {
                transform: scale(1)
            }

            75% {
                transform: scale(1.15)
            }
        }

    </style>
</head>

<body>

    <nav class="navbar sticky-top navbar-blur">
        <div class="container app">
            <span class="navbar-brand d-flex align-items-center fw-semibold mb-0">
                <i class="bi bi-droplet-fill text-primary me-2"></i> Kalkulator PDAM Tirta Wijaya
            </span>
            <button id="themeToggle" class="btn btn-sm btn-outline-secondary rounded-pill" title="Ganti tema">
                <i class="bi bi-sun-fill"></i>
            </button>
        </div>
    </nav>

    <main class="container app">

        <!-- ===== VIEW KALKULATOR ===== -->
        <section id="viewKal">
            <div class="card shadow-sm mt-3">
                <div class="card-body p-3 p-sm-4">
                    <div class="section-title mb-3">Data Pemakaian</div>
                    <select id="selectGol" class="form-select form-select-lg"></select>

                    <div class="d-flex justify-content-between align-items-center mt-3 mb-1">
                        <label for="inputPem" class="form-label mb-0">Pemakaian Air (m³)</label>
                        <span id="badgePem" class="fw-bold text-primary">0 m³</span>
                    </div>
                    <input type="number" id="inputPem" class="form-control form-control-lg" placeholder="Contoh: 25"
                        min="0" step="any" inputmode="decimal" autocomplete="off">

                    <div id="infoTarif" class="mt-3 d-flex gap-2 flex-wrap"></div>
                </div>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-body p-3 p-sm-4">
                    <div class="section-title mb-3">Rincian Estimasi Tagihan</div>
                    <div id="totalBox" class="total-box text-center p-3 mb-3">
                        <div class="text-secondary small">Estimasi Total Tagihan</div>
                        <div id="totalEl" class="total-amount">Rp 0</div>
                        <div id="noteEl" class="text-secondary small">Berdasarkan pemakaian 0 m³</div>
                    </div>



                    <div class="d-flex gap-2 mt-4">
                        <button id="btnShare"
                            class="btn btn-secondary bg-opacity-25 flex-fill rounded-pill fw-semibold">SHARE</button>
                        <button id="btnSimpan"
                            class="btn btn-primary flex-fill rounded-pill fw-semibold">SIMPAN</button>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mt-4 mb-3">
                <div class="card-body p-3 p-sm-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="section-title mb-0">Daftar Tarif 2026</div>
                        <button id="btnTarif" class="btn btn-sm btn-outline-primary rounded-pill"
                            data-bs-toggle="collapse" data-bs-target="#collapseTarif">Tampilkan</button>
                    </div>

                </div>
            </div>
            <div class="text-center small text-secondary pb-2">Tarif Perumdam Tahun 2026 · Simulasi estimasi, bukan
                tagihan resmi</div>
        </section>

        <!-- ===== VIEW RIWAYAT ===== -->
        <section id="viewRiw" class="d-none">
            <div class="card shadow-sm mt-3">
                <div class="card-body p-3 p-sm-4 d-flex justify-content-between align-items-center">
                    <div class="section-title mb-0">Riwayat Simulasi</div>
                    <button id="btnClear" class="btn btn-sm btn-outline-danger rounded-pill">Hapus Semua</button>
                </div>
                <ul id="historyList" class="list-group list-group-flush"></ul>
                <div id="emptyHist" class="text-center text-secondary py-5">
                    <i class="bi bi-clock-history fs-1 d-block mb-2"></i>Belum ada riwayat tersimpan
                </div>
            </div>
        </section>

        <!-- ===== KREDIT ===== -->
        <footer class="credit text-center mt-4 pb-2">
            created with <span class="heart">💖</span> by <span class="author">T.K</span>
        </footer>
    </main>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
        <button id="navKal" class="active"><i class="bi bi-droplet-half"></i>Kalkulator</button>
        <button id="navRiw"><i class="bi bi-clock-history"></i>Riwayat <span id="badgeRiw"
                class="badge text-bg-primary rounded-pill d-none">0</span></button>
    </nav>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast align-items-center border-0" role="status">
            <div class="d-flex">
                <div id="toastMsg" class="toast-body"></div>
                <button class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>

            {

            },
            {
                no: 27,
                nama: 'Industri Besar Khusus',
                tetap: 260000,
                t1: 15600,
                t2: 18700,
                t3: 21800
            },
            {
                no: 28,
                nama: 'Khusus B',
                tetap: 260000,
                t1: 19700,
                t2: 23600,
                t3: 27500
            },
            {
                no: 29,
                nama: 'Khusus A',
                tetap: 260000,
                t1: 41400,
                t2: 41400,
                t3: 41400
            },
            {
                no: 30,
                nama: 'Khusus A Niaga',
                tetap: 260000,
                t1: 41400,
                t2: 41400,
                t3: 41400
            }
        ];

        const $ = id => document.getElementById(id);
        const fmtRp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
        const fmtNum = n => n.toLocaleString('id-ID', {
            maximumFractionDigits: 2
        });
        const fmtDate = iso => new Date(iso).toLocaleString('id-ID', {
            day: '2-digit',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });

        /* ==== PERHITUNGAN BLOK PROGRESIF ==== */
        function hitung(t, m3) {
            const b1 = Math.min(m3, 10),
                b2 = Math.max(0, Math.min(m3, 20) - 10),
                b3 = Math.max(0, m3 - 20);
            const c1 = b1 * t.t1,
                c2 = b2 * t.t2,
                c3 = b3 * t.t3;
            return {
                b1,
                b2,
                b3,
                c1,
                c2,
                c3,
                total: t.tetap + c1 + c2 + c3
            };
        }

        /* ==== RENDER ==== */
        function render() {
            const t = TARIF.find(x => x.no == $('selectGol').value) || TARIF[0];
            const m3 = Math.max(0, parseFloat($('inputPem').value) || 0);
            const h = hitung(t, m3);
            $('badgePem').textContent = fmtNum(m3) + ' m³';
            const txt = fmtRp(h.total);
            if ($('totalEl').textContent !== txt) {
                $('totalEl').textContent = txt;
                $('totalBox').classList.remove('pulse');
                void $('totalBox').offsetWidth;
                $('totalBox').classList.add('pulse');
            }
            $('noteEl').textContent = 'Berdasarkan pemakaian ' + fmtNum(m3) + ' m³';
            $('valTetap').textContent = fmtRp(t.tetap);
            $('lbl1').innerHTML = 'Blok I (1–10 m³) <span class="text-secondary">· ' + fmtNum(h.b1) + ' m³ × ' + fmtRp(t
                .t1) + '</span>';
            $('lbl2').innerHTML = 'Blok II (11–20 m³) <span class="text-secondary">· ' + fmtNum(h.b2) + ' m³ × ' +
                fmtRp(t.t2) + '</span>';
            $('lbl3').innerHTML = 'Blok III (&gt;20 m³) <span class="text-secondary">· ' + fmtNum(h.b3) + ' m³ × ' +
                fmtRp(t.t3) + '</span>';
            $('val1').textContent = fmtRp(h.c1);
            $('val2').textContent = fmtRp(h.c2);
            $('val3').textContent = fmtRp(h.c3);
            $('infoTarif').innerHTML =
                '<span class="badge rounded-pill text-bg-secondary">Beban Tetap ' + fmtRp(t.tetap) + '</span>' +
                '<span class="badge rounded-pill text-bg-primary">1–10: ' + fmtRp(t.t1) + '</span>' +
                '<span class="badge rounded-pill text-bg-primary">11–20: ' + fmtRp(t.t2) + '</span>' +
                '<span class="badge rounded-pill text-bg-primary">&gt;20: ' + fmtRp(t.t3) + '</span>';
        }

        /* ==== POPULATE SELECT & TABEL ==== */
        function groupOf(n) {
            if (n.startsWith('Sosial')) return 'Sosial';
            if (n.startsWith('Rumah')) return 'Rumah Tangga & Rusun';
            if (n.startsWith('Niaga')) return 'Niaga';
            if (n.startsWith('Kantor')) return 'Kantor';
            if (n.startsWith('Industri')) return 'Industri';
            return 'Khusus & Lainnya';
        }
        (function () {
            const map = {};
            TARIF.forEach(t => {
                const g = groupOf(t.nama);
                if (!map[g]) {
                    map[g] = document.createElement('optgroup');
                    map[g].label = g;
                    $('selectGol').appendChild(map[g]);
                }
                map[g].appendChild(new Option(t.nama, t.no));
            });
            $('selectGol').value = '4';
            $('tbodyTarif').innerHTML = TARIF.map(t => '<tr><td>' + t.no + '</td><td>' + t.nama +
                '</td><td class="text-end">' +
                t.tetap.toLocaleString('id-ID') + '</td><td class="text-end">' + t.t1.toLocaleString('id-ID') +
                '</td><td class="text-end">' +
                t.t2.toLocaleString('id-ID') + '</td><td class="text-end">' + t.t3.toLocaleString('id-ID') +
                '</td></tr>').join('');
        })();

        /* ==== RIWAYAT (localStorage) ==== */
        let hist = JSON.parse(localStorage.getItem('pdam-riwayat') || '[]');

        function renderHistory() {
            $('historyList').innerHTML = hist.map(h =>
                '<li class="list-group-item d-flex align-items-center gap-2 py-3 hist-item" data-id="' + h.id +
                '" role="button">' +
                '<div class="flex-grow-1"><div class="fw-semibold">' + h.nama + '</div>' +
                '<div class="small text-secondary">' + fmtNum(h.m3) + ' m³ · ' + fmtDate(h.waktu) + '</div></div>' +
                '<div class="fw-bold">' + fmtRp(h.total) + '</div>' +
                '<button class="btn btn-sm btn-outline-danger rounded-pill hist-del" data-id="' + h.id +
                '"><i class="bi bi-trash"></i></button></li>').join('');
            $('emptyHist').classList.toggle('d-none', hist.length > 0);
            const b = $('badgeRiw');
            b.textContent = hist.length;
            b.classList.toggle('d-none', hist.length === 0);
        }
        $('btnSimpan').onclick = () => {
            const t = TARIF.find(x => x.no == $('selectGol').value);
            const m3 = Math.max(0, parseFloat($('inputPem').value) || 0);
            hist.unshift({
                id: Date.now(),
                waktu: new Date().toISOString(),
                nama: t.nama,
                m3,
                total: hitung(t, m3).total
            });
            localStorage.setItem('pdam-riwayat', JSON.stringify(hist));
            renderHistory();
            toast('Tersimpan ke Riwayat ✓');
        };
        $('historyList').addEventListener('click', e => {
            const del = e.target.closest('.hist-del');
            if (del) {
                hist = hist.filter(h => h.id != del.dataset.id);
                localStorage.setItem('pdam-riwayat', JSON.stringify(hist));
                renderHistory();
                toast('Item dihapus');
                return;
            }
            const item = e.target.closest('.hist-item');
            if (item) {
                const h = hist.find(x => x.id == item.dataset.id);
                $('selectGol').value = TARIF.find(t => t.nama === h.nama).no;
                $('inputPem').value = h.m3;
                render();
                switchView('kal');
            }
        });
        $('btnClear').onclick = () => {
            if (hist.length && confirm('Hapus semua riwayat?')) {
                hist = [];
                localStorage.setItem('pdam-riwayat', '[]');
                renderHistory();
                toast('Riwayat dikosongkan');
            }
        };

        /* ==== SHARE ==== */
        $('btnShare').onclick = async () => {
            const t = TARIF.find(x => x.no == $('selectGol').value);
            const m3 = Math.max(0, parseFloat($('inputPem').value) || 0),
                h = hitung(t, m3);
            const text = '*KALKULATOR PDAM TIRTA WIJAYA*\nGolongan: ' + t.nama + '\nPemakaian: ' + fmtNum(m3) +
                ' m³\n\n' +
                'Beban Tetap: ' + fmtRp(t.tetap) + '\nBlok I (1–10 m³): ' + fmtRp(h.c1) +
                '\nBlok II (11–20 m³): ' + fmtRp(h.c2) +
                '\nBlok III (>20 m³): ' + fmtRp(h.c3) + '\n*TOTAL: ' + fmtRp(h.total) +
                '*\n\ncreated with 💖 by T.K';
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Kalkulator PDAM',
                        text
                    });
                    return;
                } catch (e) {
                    if (e.name === 'AbortError') return;
                }
            }
            try {
                await navigator.clipboard.writeText(text);
                toast('Ringkasan disalin ke clipboard 📋');
            } catch (e) {
                toast('Tidak dapat menyalin teks');
            }
        };

        /* ==== NAVIGASI & TEMA ==== */
        function switchView(v) {
            $('viewKal').classList.toggle('d-none', v !== 'kal');
            $('viewRiw').classList.toggle('d-none', v !== 'riw');
            $('navKal').classList.toggle('active', v === 'kal');
            $('navRiw').classList.toggle('active', v === 'riw');
            window.scrollTo({
                top: 0
            });
        }
        $('navKal').onclick = () => switchView('kal');
        $('navRiw').onclick = () => {
            renderHistory();
            switchView('riw');
        };

        function setTheme(t) {
            document.documentElement.setAttribute('data-bs-theme', t);
            localStorage.setItem('pdam-theme', t);
            $('themeToggle').innerHTML = t === 'dark' ? '<i class="bi bi-sun-fill"></i>' :
                '<i class="bi bi-moon-stars-fill"></i>';
            document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#0d1117' :
                '#f8f9fa');
        }
        setTheme(localStorage.getItem('pdam-theme') || 'dark');
        $('themeToggle').onclick = () => setTheme(document.documentElement.getAttribute('data-bs-theme') === 'dark' ?
            'light' : 'dark');

        /* ==== UTIL ==== */
        const bsToast = new bootstrap.Toast($('toast'), {
            delay: 2200
        });

        function toast(msg) {
            $('toastMsg').textContent = msg;
            bsToast.show();
        }
        document.querySelectorAll('.quick-btn').forEach(b => b.onclick = () => {
            $('inputPem').value = b.dataset.m3;
            render();
        });
        $('selectGol').addEventListener('change', render);
        $('inputPem').addEventListener('input', render);
